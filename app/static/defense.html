<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>答辩演练 · 项目智能问答助手</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --accent:#2563eb;
          --text:#1f2430; --muted:#6b7280; --ok:#059669; --warn:#b45309;
          --bad:#dc2626; --soft:#eff6ff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
         background:var(--bg); color:var(--text); font-size:14px;
         display:flex; flex-direction:column; }

  /* ---------- 顶栏 ---------- */
  #top { background:var(--panel); border-bottom:1px solid var(--line);
         padding:0 18px; height:56px; display:flex; align-items:center;
         gap:14px; flex:none; }
  #top h1 { font-size:16px; margin:0; font-weight:600; white-space:nowrap; }
  #top .sub { font-size:12px; color:var(--muted); white-space:nowrap; }
  #top .sp { flex:1; }
  #progressWrap { display:none; align-items:center; gap:10px; min-width:220px; }
  #progressBar { flex:1; height:6px; background:#e5e7eb; border-radius:3px;
                 overflow:hidden; }
  #progressBar i { display:block; height:100%; width:0; background:var(--accent);
                   transition:width .35s; border-radius:3px; }
  #progText { font-size:12px; color:var(--muted); white-space:nowrap; }

  /* ---------- 按钮 ---------- */
  .btn { border:1px solid var(--line); background:#fff; color:var(--text);
         padding:7px 14px; border-radius:7px; font-size:13px; cursor:pointer;
         font-family:inherit; white-space:nowrap; transition:.15s; }
  .btn:hover:not(:disabled) { border-color:#c9cdd4; background:#fafbfc; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.primary:hover:not(:disabled) { background:#1d4ed8; }
  .btn.ghost { background:transparent; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.sm { padding:5px 10px; font-size:12px; }

  /* ---------- 主体 ---------- */
  #main { flex:1; overflow-y:auto; padding:22px 18px 40px; }
  .wrap { max-width:860px; margin:0 auto; }

  /* ---------- 上传卡片 ---------- */
  #uploadCard { background:var(--panel); border:1px solid var(--line);
                border-radius:14px; padding:30px; text-align:center; }
  #uploadCard h2 { margin:0 0 6px; font-size:19px; }
  #uploadCard .lead { color:var(--muted); font-size:13px; line-height:1.8;
                      margin-bottom:22px; }
  #drop { border:2px dashed #cbd5e1; border-radius:12px; padding:38px 20px;
          cursor:pointer; transition:.18s; background:#fcfcfd; }
  #drop:hover, #drop.over { border-color:var(--accent); background:var(--soft); }
  #drop .ic { font-size:38px; line-height:1; margin-bottom:10px; }
  #drop .t1 { font-size:15px; font-weight:600; margin-bottom:6px; }
  #drop .t2 { font-size:12px; color:var(--muted); }
  #fileInput { display:none; }

  #pptInfo { display:none; margin-top:18px; text-align:left;
             background:#f8fafc; border:1px solid var(--line); border-radius:10px;
             padding:14px 16px; }
  #pptInfo .row { display:flex; gap:8px; font-size:13px; margin:3px 0; }
  #pptInfo .k { color:var(--muted); min-width:64px; }
  #pptInfo .thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  #pptInfo .thumbs img { height:56px; border-radius:6px; border:1px solid var(--line);
                         cursor:zoom-in; background:#fff; }

  #startRow { margin-top:18px; display:none; }
  #startRow .btn { padding:10px 34px; font-size:14px; }

  /* ---------- 演练设置 ---------- */
  #opts { display:none; margin-top:20px; text-align:left; }
  .optGroup { margin-bottom:18px; }
  .optGroup:last-child { margin-bottom:4px; }
  .optLabel { display:block; font-size:13px; font-weight:600; margin-bottom:9px; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modeCard { border:1.5px solid var(--line); border-radius:11px; padding:13px 15px;
              cursor:pointer; transition:.16s; background:#fff; }
  .modeCard:hover { border-color:#b9c4d4; background:#fafbfc; }
  .modeCard.sel { border-color:var(--accent); background:var(--soft);
                  box-shadow:0 0 0 3px rgba(37,99,235,.08); }
  .modeCard .mt { font-size:13.5px; font-weight:600; margin-bottom:6px; }
  .modeCard .md { font-size:12px; color:var(--muted); line-height:1.7; }
  .modeCard.sel .md { color:#3b5b8c; }

  .nums { display:flex; gap:8px; flex-wrap:wrap; }
  .numBtn { border:1.5px solid var(--line); background:#fff; border-radius:9px;
            padding:7px 17px; font-size:13px; cursor:pointer; font-family:inherit;
            transition:.15s; color:var(--text); }
  .numBtn:hover { border-color:#b9c4d4; }
  .numBtn.sel { border-color:var(--accent); background:var(--soft);
                color:var(--accent); font-weight:600; }

  select.sel { width:100%; padding:9px 11px; border:1.5px solid var(--line);
               border-radius:9px; font-family:inherit; font-size:13px;
               background:#fff; color:var(--text); outline:none; cursor:pointer; }
  select.sel:focus { border-color:var(--accent); }
  .optHint { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.7; }

  /* 答辩模式下"看答案"的锁定提示 */
  .lockTip { font-size:12.5px; color:#92400e; background:#fffbeb;
             border:1px solid #fde68a; border-radius:9px; padding:9px 13px;
             margin-left:32px; margin-top:8px; line-height:1.7; }

  @media (max-width:640px){
    .modes { grid-template-columns:1fr; }
    .lockTip { margin-left:0; }
  }

  /* ---------- 聊天区 ---------- */
  #chat { display:none; }
  .qa { margin-bottom:22px; }
  .qhead { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .qno { background:var(--accent); color:#fff; font-size:12px; font-weight:600;
         width:24px; height:24px; border-radius:50%; display:flex;
         align-items:center; justify-content:center; flex:none; }
  .qtag { font-size:12px; color:var(--muted); }
  .qtext { background:var(--panel); border:1px solid var(--line); border-radius:12px;
           padding:14px 16px; line-height:1.75; white-space:pre-wrap;
           word-break:break-word; }
  .qtext .pageRef { color:var(--accent); font-weight:600; }

  .ansBox { margin-top:10px; margin-left:32px; }
  .ansBox textarea { width:100%; min-height:76px; padding:11px 13px; border-radius:10px;
                     border:1px solid var(--line); font-family:inherit; font-size:14px;
                     line-height:1.7; resize:vertical; outline:none; }
  .ansBox textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.09); }
  .ansBox .foot { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .ansBox .hint { font-size:12px; color:var(--muted); }
  .ansBox .sp { flex:1; }
  .sent { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:12px 14px; line-height:1.7; white-space:pre-wrap;
          word-break:break-word; margin-top:8px; }
  .sent .who { font-size:12px; color:var(--muted); margin-bottom:5px; }

  /* ---------- 参考答案 ---------- */
  .revealRow { margin-left:32px; margin-top:8px; }
  /* 淡黄底 + 深字。之前 .card 没设 color，长段落继承了浅色，读起来很吃力 */
  .card { background:#fffdf5; border:1px solid #eed9a2; border-radius:12px;
          padding:16px 18px; margin-top:10px; animation:fade .25s;
          color:#1f2430; }
  @keyframes fade { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
  .card h4 { margin:0 0 9px; font-size:14px; color:#92400e; font-weight:600;
             display:flex; align-items:center; gap:6px; }
  .card .body { line-height:1.9; white-space:pre-wrap; word-break:break-word;
                color:#1f2430; font-size:13.5px; }
  .card ul.kps li { color:#1f2430; font-size:13px; line-height:1.8; }
  .basisItem { background:#fff; border:1px solid #eed9a2; border-radius:9px;
               padding:11px 13px; margin-top:9px; }
  .basisSrc { font-size:12.5px; font-weight:600; color:#8a4b0f; margin-bottom:7px;
              display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .basisQuote { font-size:13px; line-height:1.8; background:#fffaeb;
                border-left:3px solid #f59e0b;
                padding:8px 11px; border-radius:0 6px 6px 0; color:#292524;
                white-space:pre-wrap; word-break:break-word; }
  .basisPoint { font-size:12.5px; color:#57534e; margin-top:7px; line-height:1.7; }
  .vtag { font-size:11px; padding:1px 6px; border-radius:4px; font-weight:400; }
  .vtag.ok { background:#d1fae5; color:#065f46; }
  .vtag.no { background:#fee2e2; color:#991b1b; }
  .kps { margin:8px 0 0; padding-left:18px; }
  .kps li { margin:4px 0; line-height:1.7; font-size:13px; }
  .refs { margin-top:12px; }
  .refs .rh { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .refItem { background:#fff; border:1px solid #eed9a2; border-radius:9px;
             padding:10px 13px; margin-top:7px; font-size:13px; line-height:1.75;
             color:#1f2430; }
  .refItem .rq { font-weight:600; margin-bottom:5px; color:#1f2430; }
  .refItem .rt { color:#6b7280; margin-top:5px; padding-left:10px;
                 border-left:2px solid #e5e7eb; }

  /* ---------- 报告 ---------- */
  #report { display:none; }
  .upbar { height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden; margin-top:10px; width:100%; }
  .upbar i { display:block; height:100%; width:0; background:#2563eb; transition:width .2s; }
  .scoreCard { background:var(--panel); border:1px solid var(--line); border-radius:14px;
               padding:26px; text-align:center; margin-bottom:18px; }
  .scoreBig { font-size:46px; font-weight:700; line-height:1; }
  .scoreBig small { font-size:17px; color:var(--muted); font-weight:400; }
  .scoreGrade { display:inline-block; margin-top:12px; padding:5px 18px;
                border-radius:20px; font-size:14px; font-weight:600; }
  .g-excellent { background:#d1fae5; color:#065f46; }
  .g-good      { background:#dbeafe; color:#1e40af; }
  .g-pass      { background:#fef3c7; color:#92400e; }
  .g-fail      { background:#fee2e2; color:#991b1b; }
  .scoreMeta { font-size:12.5px; color:var(--muted); margin-top:14px; line-height:1.9; }
  .itemRow { display:flex; gap:10px; align-items:flex-start; padding:11px 0;
             border-bottom:1px solid #f1f3f5; }
  .itemRow:last-child { border-bottom:none; }
  .itemScore { flex:none; width:42px; text-align:center; font-weight:700;
               font-size:15px; padding-top:1px; }
  .itemScore.hi { color:var(--ok); }
  .itemScore.mid { color:var(--warn); }
  .itemScore.lo { color:var(--bad); }
  .itemBody { flex:1; min-width:0; }
  .itemQ { font-size:13px; line-height:1.65; margin-bottom:4px; }
  .itemC { font-size:12.5px; color:var(--muted); line-height:1.7; }

  /* ---------- 底部输入条 ---------- */
  #bottom { display:none; flex:none; background:var(--panel);
            border-top:1px solid var(--line); padding:12px 18px; }
  #bottom .wrap { display:flex; gap:10px; align-items:flex-end; }
  #answer { flex:1; min-height:46px; max-height:150px; padding:12px 14px;
            border-radius:10px; border:1px solid var(--line); font-family:inherit;
            font-size:14px; line-height:1.6; resize:none; outline:none; }
  #answer:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.09); }
  #answer:disabled { background:#f9fafb; }

  /* ---------- 通用 ---------- */
  .spin { display:inline-block; width:13px; height:13px; border:2px solid #d1d5db;
          border-top-color:var(--accent); border-radius:50%;
          animation:sp .7s linear infinite; vertical-align:-2px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
           background:#1f2937; color:#fff; padding:10px 20px; border-radius:9px;
           font-size:13px; z-index:99; opacity:0; transition:.25s; pointer-events:none; }
  .toast.show { opacity:1; }
  .empty { text-align:center; color:var(--muted); padding:50px 20px; font-size:13px; }

  /* ---------- 图片放大 ---------- */
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:100;
            display:none; align-items:center; justify-content:center; cursor:zoom-out; }
  #viewer.show { display:flex; }
  #viewer img { max-width:92vw; max-height:88vh; border-radius:8px; }
  #viewer .x { position:absolute; top:18px; right:24px; color:#fff; font-size:30px;
               cursor:pointer; line-height:1; opacity:.8; }
  #viewer .x:hover { opacity:1; }

  @media (max-width:640px){
    #top h1 { font-size:15px; } #top .sub { display:none; }
    #main { padding:14px 12px 30px; }
    .ansBox { margin-left:0; } .revealRow { margin-left:0; }
    .qno { width:22px; height:22px; font-size:11px; }
  }
</style>
</head>
<body>

<div id="top">
  <h1>🎓 答辩演练</h1>
  <span class="sub">上传你的答辩 PPT，AI 扮演评委提问</span>
  <span class="sp"></span>
  <div id="progressWrap">
    <div id="progressBar"><i></i></div>
    <span id="progText">0 / 10</span>
  </div>
  <a class="btn ghost sm" href="/" onclick="return backToQa(event)" title="回到项目问答">← 返回问答</a>
</div>

<div id="main">
  <div class="wrap">

    <!-- 上传 -->
    <div id="uploadCard">
      <h2>上传你的答辩 PPT</h2>
      <div class="lead">
        我扮演评委，结合你 PPT 的内容、历史答辩里真实问过的问题、公司业务手册来提问。<br>
        答完可以看参考答案和依据。
      </div>
      <div id="drop">
        <input type="file" id="fileInput" accept=".pptx,.ppt">
        <div class="ic">📊</div>
        <div class="t1">点击选择，或把 PPT 拖进来</div>
        <div class="t2">支持 .pptx / .ppt，最大 60MB</div>
      </div>
      <div id="pptInfo"></div>

      <!-- 演练设置：模式 / 题数 / 依据知识库 -->
      <div id="opts" style="display:none">
        <div class="optGroup">
          <label class="optLabel">选择模式</label>
          <div class="modes">
            <div class="modeCard sel" data-mode="practice">
              <div class="mt">📖 练习模式</div>
              <div class="md">每答完一题，立刻能看参考答案和依据。<br>适合自己边学边练。</div>
            </div>
            <div class="modeCard" data-mode="exam">
              <div class="mt">🎯 答辩模式</div>
              <div class="md">全程不给答案，全部答完统一看解析。<br>模拟真评委，更接近实战。</div>
            </div>
          </div>
        </div>

        <div class="optGroup">
          <label class="optLabel">题目数量</label>
          <div class="nums" id="numRow"></div>
        </div>

        <div class="optGroup">
          <label class="optLabel">出题依据的知识库</label>
          <select id="kbSel" class="sel"></select>
          <div class="optHint" id="kbHint"></div>
        </div>
      </div>

      <div id="startRow">
        <button class="btn primary" id="startBtn">开始演练</button>
      </div>
    </div>

    <!-- 对话 -->
    <div id="chat"></div>

    <!-- 报告 -->
    <div id="report"></div>
  </div>
</div>

<div id="bottom">
  <div class="wrap">
    <textarea id="answer" placeholder="在这里作答…（Ctrl+Enter 提交）" rows="1"></textarea>
    <button class="btn primary" id="sendBtn">提交回答</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="viewer"><span class="x">×</span><img alt=""></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function token(){
  try { return sessionStorage.getItem('rag.token') || ''; } catch(e) { return ''; }
}

// 本标签页没有 token —— 可能是从主页面点「答辩演练」新开的一个标签页。
// 向打开我的那个窗口要一次 token，拿到就存进自己的 sessionStorage。
// 没人回应（比如直接把地址粘到新标签页）就照常走 → 会回登录页。
function askTokenFromOpener(){
  if (token()) return Promise.resolve(true);
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type:'defense-want-token' }, location.origin);
    }
  } catch(e){}
  return new Promise(resolve => {
    const done = (ok) => {
      window.removeEventListener('message', onMsg);
      resolve(ok);
    };
    const onMsg = (e) => {
      if (e.origin !== location.origin) return;
      if (!e.data || e.data.type !== 'defense-token') return;
      const t = e.data.token || '';
      if (t) {
        try { sessionStorage.setItem('rag.token', t); } catch(err){}
      }
      done(!!t);
    };
    window.addEventListener('message', onMsg);
    // 等 1.2 秒还没人给，就认为拿不到，直接走登录
    setTimeout(() => done(false), 1200);
  });
}
function withAuth(opt){
  opt = opt || {};
  opt.headers = Object.assign({}, opt.headers || {});
  const t = token();
  if (t) opt.headers['X-RAG-Token'] = t;
  opt.credentials = 'same-origin';
  return opt;
}
function toast(msg, ms){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), ms || 2600);
}
async function api(url, opt){
  const r = await fetch(url, withAuth(opt));
  if (r.status === 401){
    location.href = '/';                 // 没登录，回主页面登
    return { ok:false, msg:'需要登录' };
  }
  try { return await r.json(); }
  catch(e){ return { ok:false, msg:'服务器返回异常' }; }
}

let PPT = null;         // 解析结果
let SESSION = '';       // 会话 id
let CURRENT_Q = '';     // 当前问题
let QNO = 0;            // 已问了几题
let TOTAL = 10;         // 本次总题数
let MODE = 'practice';  // practice 练习 / exam 答辩
let REVEAL_OK = true;   // 现在能不能看答案
let KB_ID = '';         // 用哪个知识库当依据
let BUSY = false;

const ANSWERED = [];    // 已答的题 [{no, q, a}]，答辩模式最后统一看解析用

// 进页面先确认身份：本标签页没有 token 就向打开我的窗口要一次。
// 拿不到也不拦着用——直接访问该地址时服务端会正常要求登录。
let READY = askTokenFromOpener();
READY.catch(() => {});

// 返回问答要不要直接进知识库，取决于知识库权限；没有就回入口选择页
let MY_PERMS = { kb: false, defense: false };
READY.then(() => {
  api('/api/me').then(d => {
    if (d && d.ok && d.user){
      MY_PERMS = d.user.perms || { kb: false, defense: false };
      if (d.user.role === 'admin') MY_PERMS = { kb: true, defense: true };
    }
  }).catch(() => {});
}).catch(() => {});

function backToQa(ev){
  if (ev) ev.preventDefault();
  try{
    if (MY_PERMS.kb) sessionStorage.setItem('rag.homePicked', '1');
    else sessionStorage.removeItem('rag.homePicked');
  }catch(e){}
  location.href = '/';
  return false;
}

// ---------------- 演练设置 ----------------
const NUM_OPTIONS = [3, 5, 10, 15, 20];
let PICK_N = 10;

function renderNums(){
  $('#numRow').innerHTML = NUM_OPTIONS.map(n =>
    `<button class="numBtn${n === PICK_N ? ' sel' : ''}" data-n="${n}">${n} 题</button>`
  ).join('');
  $('#numRow').querySelectorAll('.numBtn').forEach(b => {
    b.onclick = () => { PICK_N = parseInt(b.dataset.n, 10); renderNums(); updateStartBtn(); };
  });
}
function updateStartBtn(){
  const m = MODE === 'exam' ? '答辩模式' : '练习模式';
  $('#startBtn').textContent = `开始演练（${m} · 共 ${PICK_N} 题）`;
}
function setMode(m){
  MODE = m;
  document.querySelectorAll('.modeCard').forEach(c =>
    c.classList.toggle('sel', c.dataset.mode === m));
  updateStartBtn();
}
document.querySelectorAll('.modeCard').forEach(c => {
  c.onclick = () => setMode(c.dataset.mode);
});

// 知识库下拉：默认选业务手册，其它库都能选
async function loadKbOptions(){
  const sel = $('#kbSel');
  sel.innerHTML = '<option value="">加载中…</option>';
  await READY;
  let d;
  try {
    const r = await fetch('/api/kb', withAuth({ credentials:'same-origin' }));
    d = await r.json();
  } catch(e){ d = { kbs: [] }; }
  const kbs = (d.kbs || []).filter(k => k.name);
  if (!kbs.length){
    sel.innerHTML = '<option value="">（没有可用知识库，将只按历史答辩出题）</option>';
    KB_ID = '';
    return;
  }
  // 业务手册排第一并默认选中；其余按名字排序
  const manual = kbs.filter(k => k.name.indexOf('业务手册') >= 0);
  const others = kbs.filter(k => k.name.indexOf('业务手册') < 0)
                     .sort((a,b) => (a.name||'').localeCompare(b.name||'', 'zh'));
  const list = [...manual, ...others];
  sel.innerHTML = list.map(k =>
    `<option value="${k.id}">${esc(k.name)}${k.readonly ? '（别人分享的·只读）' : ''}` +
    `　· ${k.chunk_count || k.chunks || 0} 段</option>`
  ).join('');
  KB_ID = list[0].id;
  sel.value = KB_ID;
  updateKbHint();
  sel.onchange = () => {
    KB_ID = sel.value;
    updateKbHint();
  };
}
function updateKbHint(){
  const opt = $('#kbSel').selectedOptions[0];
  const name = opt ? opt.textContent.split('　')[0] : '';
  $('#kbHint').textContent = KB_ID
    ? `出题和参考答案里的「依据」都从这个库找：${name}`
    : '没有选库，只能按历史答辩和你的 PPT 出题，给不出文件依据。';
}

// ---------------- 上传 ----------------
const drop = $('#drop'), fi = $('#fileInput');
drop.onclick = () => fi.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) uploadFile(f);
};
fi.onchange = () => { if (fi.files[0]) uploadFile(fi.files[0]); };

function xhrUpload(url, fd, onProgress){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    const t = token();
    if (t) xhr.setRequestHeader('X-RAG-Token', t);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
    };
    xhr.onload = () => {
      if (xhr.status === 401){ resolve({ status:401, d:{} }); return; }
      let d;
      try { d = JSON.parse(xhr.responseText); }
      catch(e){ d = { ok:false, msg:'解析失败' }; }
      resolve({ status:xhr.status, d });
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.send(fd);
  });
}

async function uploadFile(file){
  if (!/\.pptx?$/i.test(file.name)){ toast('只支持 .pptx / .ppt 文件'); return; }
  if (file.size > 60*1024*1024){ toast('文件太大，限 60MB'); return; }
  await READY;   // 等 token 到位，否则上传会被 401 弹回登录页

  drop.innerHTML = '<div class="ic"><span class="spin" style="width:26px;height:26px;border-width:3px"></span></div>' +
                   '<div class="t1" id="upTitle">正在上传 PPT…</div>' +
                   '<div class="t2" id="upPct">0%</div>' +
                   '<div class="upbar"><i id="upFill"></i></div>';

  const fd = new FormData();
  fd.append('file', file);
  let d;
  try{
    const res = await xhrUpload('/api/defense/upload', fd, (loaded, total) => {
      const pct = Math.round(loaded * 100 / Math.max(1, total));
      const tEl = document.getElementById('upTitle');
      const pEl = document.getElementById('upPct');
      const fEl = document.getElementById('upFill');
      if (tEl) tEl.textContent = '正在上传 PPT…';
      if (pEl) pEl.textContent = pct + '%';
      if (fEl) fEl.style.width = pct + '%';
    });
    if (res.status === 401){ location.href = '/'; return; }
    d = res.d;
    drop.innerHTML = '<div class="ic"><span class="spin" style="width:26px;height:26px;border-width:3px"></span></div>' +
                     '<div class="t1">上传完成，正在解析 PPT…</div>' +
                     '<div class="t2">提取文字和图片，通常几秒</div>';
  }catch(e){
    drop.innerHTML = '<div class="ic">⚠️</div><div class="t1">上传失败：' + esc(e.message) +
                     '</div><div class="t2">点这里重新选择</div>';
    drop.onclick = () => fi.click();
    return;
  }

  if (!d.ok){
    drop.innerHTML = '<div class="ic">⚠️</div><div class="t1">' + esc(d.msg || '解析失败') +
                     '</div><div class="t2">点这里重新选择</div>';
    drop.onclick = () => fi.click();
    return;
  }

  PPT = d;
  drop.style.display = 'none';
  const withImg = (d.slides || []).filter(s => (s.images||[]).length);
  let thumbs = '';
  if (withImg.length){
    thumbs = '<div class="thumbs">' + withImg.slice(0,6).map(s =>
      `<img src="${s.images[0].url}" title="第${s.no}页 ${esc(s.title||'')}" data-img="${s.images[0].url}">`
    ).join('') + '</div>';
  }
  $('#pptInfo').style.display = 'block';
  $('#pptInfo').innerHTML =
    `<div class="row"><span class="k">文件</span><span>${esc(d.name)}</span></div>
     <div class="row"><span class="k">页数</span><span>${d.pages} 页</span></div>
     <div class="row"><span class="k">图片</span><span>${d.images} 张（${withImg.length} 页带图）</span></div>
     <div class="row"><span class="k">正文</span><span>${d.chars} 字</span></div>
     ${thumbs}`;

  $('#pptInfo').querySelectorAll('.thumbs img').forEach(im => {
    im.onclick = () => openViewer(im.dataset.img);
  });

  // 选项区展开 + 拉知识库列表
  $('#opts').style.display = 'block';
  $('#startRow').style.display = 'block';
  renderNums();
  updateStartBtn();
  loadKbOptions();
}

// ---------------- 开始演练 ----------------
$('#startBtn').onclick = startDefense;
async function startDefense(){
  if (!PPT || BUSY) return;
  BUSY = true;
  SESSION = '';
  TOTAL = PICK_N;
  ANSWERED.length = 0;
  $('#startRow').style.display = 'none';
  $('#uploadCard').style.display = 'none';
  $('#chat').style.display = 'block';
  $('#bottom').style.display = 'block';
  $('#progressWrap').style.display = 'flex';
  updateProgress(0);

  // 顶栏标出模式和题数，演练过程中随时能看到自己在哪种模式
  const modeName = MODE === 'exam' ? '答辩模式' : '练习模式';
  const sub = document.querySelector('#top .sub');
  if (sub) sub.textContent = `${modeName} · 共 ${PICK_N} 题`;

  const box = $('#chat');
  const t0 = Date.now();
  const tick = setInterval(() => {
    const sec = Math.floor((Date.now() - t0) / 1000);
    box.innerHTML = '<div class="empty"><span class="spin"></span> 正在准备第一个问题… 已等待 ' + sec +
      ' 秒<br><span style="font-size:12px;color:var(--muted)">通常 10~30 秒，模型思考时会更久</span></div>';
  }, 1000);
  box.innerHTML = '<div class="empty"><span class="spin"></span> 正在准备第一个问题… 已等待 0 秒</div>';

  const d = await api('/api/defense/start', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ ppt_id: PPT.id, mode: MODE, total: PICK_N, kb_id: KB_ID })
  });
  clearInterval(tick);
  BUSY = false;
  if (!d.ok){
    box.innerHTML = '<div class="empty">⚠️ ' + esc(d.msg || '开始失败') +
      '<br><button class="btn primary" id="retryStartBtn" style="margin-top:12px">↻ 重试出题</button></div>';
    const rb = document.getElementById('retryStartBtn');
    if (rb) rb.onclick = () => startDefense();
    return;
  }
  SESSION = d.session;
  TOTAL = d.total || PICK_N;
  REVEAL_OK = (d.reveal !== false);
  box.innerHTML = '';
  showQuestion(d.question, d.no || 1);
}

function updateProgress(n){
  $('#progressBar').firstElementChild.style.width = Math.min(100, n / TOTAL * 100) + '%';
  $('#progText').textContent = n + ' / ' + TOTAL;
}

// 把问题里的"第N页"高亮
function markPage(t){
  return esc(t).replace(/第\s*(\d{1,3})\s*页/g,
    '<span class="pageRef">第$1页</span>');
}

function showQuestion(q, no){
  QNO = no;
  CURRENT_Q = q;
  const box = $('#chat');
  const div = document.createElement('div');
  div.className = 'qa';
  div.id = 'qa' + no;
  div.innerHTML =
    `<div class="qhead"><span class="qno">${no}</span>
       <span class="qtag">评委提问 · 第 ${no} / ${TOTAL} 题</span></div>
     <div class="qtext">${markPage(q)}</div>`;
  box.appendChild(div);
  div.scrollIntoView({ behavior:'smooth', block:'start' });

  const ta = $('#answer');

// ---------------- 提交回答 ----------------
$('#sendBtn').onclick = submitAnswer;
$('#answer').onkeydown = e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); submitAnswer(); }
};
$('#answer').oninput = function(){
  this.style.height = 'auto';
  this.style.height = Math.min(150, this.scrollHeight) + 'px';
};

async function submitAnswer(){
  if (BUSY || !SESSION) return;
  const ta = $('#answer');
  const a = ta.value.trim();
  if (!a){ toast('写点什么再提交吧'); ta.focus(); return; }
  // 上一次失败留下的重试按钮先清掉，避免堆叠
  document.querySelectorAll('.retrySubmit').forEach(b => b.remove());

  BUSY = true;
  ta.disabled = true; $('#sendBtn').disabled = true;
  ta.value = ''; ta.style.height = 'auto';

  const holder = $('#qa' + QNO);
  const sentDiv = document.createElement('div');
  sentDiv.className = 'ansBox';
  sentDiv.innerHTML = `<div class="sent"><div class="who">我的回答</div>${esc(a)}</div>`;
  holder.appendChild(sentDiv);

  // 这是一次新回答，把旧的参考答案按钮留着（可以回看）
  const think = document.createElement('div');
  think.className = 'revealRow';
  think.innerHTML = '<span style="font-size:12.5px;color:var(--muted)">' +
                    '<span class="spin"></span> 评委正在追问…</span>';
  holder.appendChild(think);

  const revealRow = document.createElement('div');
  revealRow.className = 'revealRow';
  revealRow.style.display = 'none';
  holder.appendChild(revealRow);

  const d = await api('/api/defense/answer', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ session: SESSION, question: CURRENT_Q, answer: a })
  });
  BUSY = false;
  think.remove();

  if (!d.ok){
    // 把回答放回输入框，并给一个明确的重试按钮；不要让人重新打字
    ta.disabled = false; ta.value = a; $('#sendBtn').disabled = false;
    const retry = document.createElement('button');
    retry.className = 'btn retrySubmit';
    retry.textContent = '↻ 重试提交';
    retry.onclick = () => { retry.disabled = true; submitAnswer(); };
    holder.appendChild(retry);
    toast(d.msg || '提交失败，请重试');
    return;
  }

  ANSWERED.push({ no: QNO, q: CURRENT_Q, a: a });

  if (d.done){
    REVEAL_OK = true;
    // 最后一题没有"下一题"可走，也要给它补上看答案按钮，
    // 否则报告页只能看前面几题的解析。
    renderAnswerActions(revealRow, QNO, true);
    await showReport();
    return;
  }

  // 练习模式：这题答完立刻能看
  // 答辩模式：先不放按钮，答完统一看（服务端也会拦）
  const newRevealOk = (d.reveal !== false);
  REVEAL_OK = newRevealOk;
  renderAnswerActions(revealRow, QNO, newRevealOk);

  showQuestion(d.question, d.no || (QNO + 1));
}

// ---------------- 看参考答案 ----------------
function renderAnswerActions(holder, no, allowed){
  holder.style.display = 'block';
  holder.innerHTML = '';
  if (allowed){
    const b = document.createElement('button');
    b.className = 'btn sm';
    b.innerHTML = '💡 看参考答案和依据';
    b.onclick = () => loadReveal(holder, no);
    holder.appendChild(b);
  } else {
    const tip = document.createElement('div');
    tip.className = 'lockTip';
    tip.id = 'lockTip' + no;
    tip.innerHTML = `🔒 答辩模式：这一题的解析先留着，全部 ${TOTAL} 题答完就能统一查看。`;
    holder.appendChild(tip);
  }
}

async function loadReveal(holder, no){
  const t0 = Date.now();
  const tick = setInterval(() => {
    holder.innerHTML = '<span style="font-size:12.5px;color:var(--muted)">' +
      '<span class="spin"></span> 正在整理标准答案和依据… 已等待 ' +
      Math.floor((Date.now() - t0) / 1000) + ' 秒</span>';
  }, 1000);
  holder.innerHTML = '<span style="font-size:12.5px;color:var(--muted)">' +
                     '<span class="spin"></span> 正在整理标准答案和依据… 已等待 0 秒</span>';
  const d = await api('/api/defense/reveal', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ session: SESSION, index: no - 1 })
  });
  clearInterval(tick);
  if (!d.ok){
    holder.innerHTML = '';
    const b = document.createElement('button');
    b.className = 'btn sm'; b.textContent = '💡 重试查看参考答案';
    b.onclick = () => loadReveal(holder, no);
    holder.appendChild(b);
    toast(d.msg || '生成失败');
    return;
  }
  holder.innerHTML = revealHtml(d);
}

function revealHtml(d){
  let h = '<div class="card">';
  h += '<h4>📖 标准答案</h4><div class="body">' + esc(d.answer) + '</div>';

  if ((d.basis || []).length){
    h += '<h4 style="margin-top:16px">📎 依据</h4>';
    for (const b of d.basis){
      const hasSrc = !!b.source;
      const v = b.verified
        ? '<span class="vtag ok">✓ 手册原文可核对</span>'
        : '<span class="vtag no">⚠ 未在手册中核对到</span>';
      h += '<div class="basisItem">';
      if (hasSrc) h += '<div class="basisSrc">' + esc(b.source) + (b.quote ? v : '') + '</div>';
      if (b.quote) h += '<div class="basisQuote">' + esc(b.quote) + '</div>';
      if (b.point) h += '<div class="basisPoint">' + esc(b.point) + '</div>';
      h += '</div>';
    }
  }

  if ((d.key_points || []).length){
    h += '<h4 style="margin-top:16px">🎯 关键得分点</h4><ul class="kps">';
    for (const k of d.key_points) h += '<li>' + esc(k) + '</li>';
    h += '</ul>';
  }

  if ((d.refs || []).length){
    h += '<div class="refs"><div class="rh">📚 历史答辩里，别人碰上类似问题是怎么答的</div>';
    for (const r of d.refs){
      h += '<div class="refItem"><div class="rq">问：' + esc(r.question) + '</div>';
      if (r.answer) h += '<div>答：' + esc(r.answer) + '</div>';
      for (const c of (r.comments || [])){
        if (c) h += '<div class="rt">导师点评：' + esc(c) + '</div>';
      }
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}

// ---------------- 报告 ----------------
async function showReport(){
  $('#bottom').style.display = 'none';
  // 答完了，把每一题的锁定提示换成可点的按钮（两种模式此时都能看）
  document.querySelectorAll('.lockTip').forEach(tip => {
    const no = parseInt((tip.id || '').replace('lockTip', ''), 10);
    if (no) renderAnswerActions(tip.parentNode, no, true);
  });
  const box = $('#report');
  box.style.display = 'block';
  box.innerHTML = '<div class="empty"><span class="spin"></span> 正在生成演练报告…</div>';

  const d = await api('/api/defense/report', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ session: SESSION })
  });
  if (!d.ok){
    box.innerHTML = '<div class="empty">⚠️ ' + esc(d.msg || '报告生成失败') + '</div>';
    return;
  }
  updateProgress(TOTAL);

  const pct = d.full ? Math.round(d.total / d.full * 100) : 0;
  const gcls = pct >= 90 ? 'g-excellent' : pct >= 75 ? 'g-good' : pct >= 60 ? 'g-pass' : 'g-fail';

  let h = '<div class="scoreCard">';
  h += `<div class="scoreBig">${d.total}<small> / ${d.full}</small></div>`;
  h += `<div class="scoreGrade ${gcls}">${esc(d.grade || '')}</div>`;
  h += '<div class="scoreMeta">';
  if (d.mode_label) h += esc(d.mode_label) + '　·　';
  if (d.ppt_name) h += '答辩材料：' + esc(d.ppt_name) + '　·　';
  h += '共 ' + (d.items || []).length + ' 题';
  if ((d.asked_pages || []).length) h += '　·　考到 PPT 第 ' + d.asked_pages.join('、') + ' 页';
  h += '</div></div>';

  // 逐题（每题满分按 100/题数 折算，3 题时每题约 33.3）
  h += '<div class="scoreCard" style="text-align:left;padding:18px 22px">';
  h += '<h4 style="margin:0 0 6px;font-size:14px">逐题得分</h4>';
  const _per = 100 / Math.max(1, (d.items || []).length);
  for (const it of (d.items || [])){
    const cls = it.score >= _per * 0.8 ? 'hi' : it.score >= _per * 0.5 ? 'mid' : 'lo';
    h += `<div class="itemRow">
            <div class="itemScore ${cls}">${it.score}</div>
            <div class="itemBody">
              <div class="itemQ">${markPage(it.question || '')}</div>
              <div class="itemC">${esc(it.comment || '')}</div>
            </div>
          </div>`;
  }
  h += '</div>';

  // 综合评价
  h += '<div class="scoreCard" style="text-align:left;padding:20px 22px">';
  if ((d.strengths || []).length){
    h += '<h4 style="margin:0 0 7px;font-size:14px">👍 做得好的</h4><ul class="kps">';
    for (const s of d.strengths) h += '<li>' + esc(s) + '</li>';
    h += '</ul>';
  }
  if ((d.gaps || []).length){
    h += '<h4 style="margin:16px 0 7px;font-size:14px">📌 还要补的</h4><ul class="kps">';
    for (const s of d.gaps) h += '<li>' + esc(s) + '</li>';
    h += '</ul>';
  }
  if ((d.misconceptions || []).length){
    h += '<h4 style="margin:16px 0 7px;font-size:14px">⚠️ 概念上搞混了</h4><ul class="kps">';
    for (const s of d.misconceptions) h += '<li>' + esc(s) + '</li>';
    h += '</ul>';
  }
  if (d.advice){
    h += '<h4 style="margin:16px 0 7px;font-size:14px">💡 建议</h4><div style="line-height:1.8">' +
         esc(d.advice) + '</div>';
  }
  h += '</div>';

  // 逐题解析：放到全部答完后按需生成，复用整场问答；不拖慢单题“看参考答案”
  h += '<div class="scoreCard" style="text-align:left;padding:18px 22px">';
  h += '<h4 style="margin:0 0 7px;font-size:14px">📝 逐题解析</h4>';
  h += '<div id="analysisBox" style="font-size:13px;color:var(--muted);line-height:1.8">' +
       '评分只看本次作答。需要逐题分析（哪里对、哪里漏、概念有没有混淆）时，点下面按钮。</div>';
  h += '<button class="btn" id="analysisBtn" style="margin-top:10px" onclick="loadAnalysis()">生成解析报告</button>';
  h += '</div>';

  h += '<div style="text-align:center;margin:22px 0 10px;display:flex;gap:10px;justify-content:center">' +
       '<button class="btn" onclick="location.reload()">换一份 PPT 重新演练</button>' +
       '<a class="btn ghost" href="/" onclick="return backToQa(event)">回到项目问答</a></div>';

  box.innerHTML = h;
  box.scrollIntoView({ behavior:'smooth', block:'start' });
}

let ANALYSIS_BUSY = false;

  if (ANALYSIS_BUSY) return;
  const box = $('#analysisBox'), btn = $('#analysisBtn');

  const t0 = Date.now();
  box.innerHTML = '<div class="empty"><span class="spin"></span> 正在生成逐题解析… 已等待 <b id="anaSec">0</b> 秒</div>';
  const timer = setInterval(() => {
    const e = $('#anaSec');
    if (e) e.textContent = Math.floor((Date.now() - t0) / 1000);
  }, 1000);
  try{
    const d = await api('/api/defense/analysis', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session: SESSION })
    });
    clearInterval(timer);
    if (!d.ok){

        '<button class="btn" style="margin-top:8px" onclick="loadAnalysis()">↻ 重试生成</button>';
      if (btn) btn.disabled = false;
      return;
    }
    let h = '';
    for (const it of (d.items || [])){
      h += '<div style="margin:10px 0;padding:10px 12px;border-left:3px solid #93c5fd;' +
           'background:#f8fafc;border-radius:6px">' +
           '<div style="font-weight:600;margin-bottom:4px">第 ' + (it.no || '') + ' 题</div>' +
           '<div style="color:#374151;line-height:1.75">' + esc(it.diagnosis || '（无）') + '</div></div>';
    }
    if (d.overall){
      h += '<div style="margin-top:12px"><b>总体评价</b>' +
           '<div style="line-height:1.8;color:#374151">' + esc(d.overall) + '</div></div>';
    }
    box.innerHTML = h;
    if (btn) btn.style.display = 'none';
  }catch(e){
    clearInterval(timer);
    box.innerHTML = '<div style="color:#b91c1c">生成失败: ' + esc(e.message) + '</div>' +
      '<button class="btn" style="margin-top:8px" onclick="loadAnalysis()">↻ 重试生成</button>';
    if (btn) btn.disabled = false;
  }finally{
    ANALYSIS_BUSY = false;
  }
}

// ---------------- 图片放大 ----------------
function openViewer(url){
  const v = $('#viewer');
  v.querySelector('img').src = url;
  v.classList.add('show');
}
$('#viewer').onclick = () => $('#viewer').classList.remove('show');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#viewer').classList.remove('show');
});
</script>
