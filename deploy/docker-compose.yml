# 生产编排（Docker 20.10 + compose v2）
# 宿主机数据卷：
#   /opt/rag/data    <- 业务手册 KB + registry/users
#   /opt/rag/models  <- bge-small / bge-reranker
#   /opt/rag/docs    <- 业务手册源文档（预览/图片）
#   /opt/rag/config.json <- 配置（含 LLM Key，600）
services:
  rag:
    image: rag-bff:${RAG_TAG:-local}
    container_name: rag-bff
    network_mode: host          # 不建 docker bridge、不改 iptables；应用监听 0.0.0.0:8000
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4.0
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
    volumes:
      - /opt/rag/data:/app/app/data
      - /opt/rag/models:/app/models
      - /opt/rag/docs:/opt/rag/docs:ro
      - /opt/rag/config.json:/app/app/config.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
