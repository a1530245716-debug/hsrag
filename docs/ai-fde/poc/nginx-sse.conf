# 内网 RAG BFF 的 Nginx 参考配置
# 注意：证书、域名、上游地址按实际替换；不要提交真实证书和密钥。

server {
    listen 443 ssl;
    server_name rag.example.internal;

    ssl_certificate     /etc/nginx/certs/rag.crt;
    ssl_certificate_key /etc/nginx/certs/rag.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传 PPT/PDF/贴图
    client_max_body_size 100m;
    client_body_timeout  120s;

    # SSE + 普通请求
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 问答可能持续几十秒到几分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 关键：不要让 Nginx 缓冲 SSE
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # 如果上游自己发 X-Accel-Buffering: no，Nginx 默认会遵守
    }

    # 可选：限制来源网段
    # allow 10.20.0.0/16;
    # allow 10.30.0.0/24;
    # deny all;
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}
